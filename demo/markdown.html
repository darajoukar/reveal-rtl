<body>
	<div class="reveal">
		<div class="slides">
			<!-- Slides written in Markdown: "---" between slides, "--" for vertical slides, "Note:" for speaker notes. -->
			<section data-markdown data-separator="^---$" data-separator-vertical="^--$" data-separator-notes="^Note:">
				<textarea data-template>
# ارائه با Markdown

اسلایدها را با Markdown بنویسید؛ راست‌به‌چپ و اعداد فارسی خودکار است.

Note: این یادداشت سخنران از Markdown آمده است.

---

## فهرست

- **پررنگ** و *مورب* و `کد درون‌خطی`
- فهرست تودرتو
  - سطح دوم با ۲ فاصله
- اعداد: 2026 و 14 درصد

---

## فهرست شماره‌دار

1. نوشتن متن
2. جداکردن اسلایدها با `---`
3. اجرای ارائه

---

## کد

```js
// Code stays left-to-right with Latin digits: 42
Reveal.initialize({ plugins: [ RevealMarkdown, RevealRTL() ] });
```

---

## جدول

| ویژگی | وضعیت |
|---|---|
| Markdown | نسخه 0.3 |
| یادداشت‌ها | پشتیبانی |

---

## اسلاید عمودی

با کلید پایین ادامه دهید

--

## زیراسلاید

با `--` ساخته شده است.
				</textarea>
			</section>
		</div>
	</div>
