name: Release assets

# Attaches the rtl-slides skill as a zip to each GitHub release, for uploading to claude.ai
# (Settings → Capabilities → Skills) or copying into ~/.claude/skills/.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  skill-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Zip the skill
        run: |
          cd plugins/reveal-rtl/skills
          zip -r "$GITHUB_WORKSPACE/rtl-slides-skill.zip" rtl-slides

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" rtl-slides-skill.zip --clobber
