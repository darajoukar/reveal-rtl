name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: catches a new reveal.js release breaking the parts reveal-rtl patches.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Persian text check
        run: npm run lint:text

      # dist/ and themes/ are committed (the demo and script-tag users load them); they must match the sources.
      - name: Check build output is up to date
        run: |
          npm run build
          git diff --exit-code dist/ themes/ || (echo "::error::dist/ or themes/ is stale. Run 'npm run build' and commit." && exit 1)

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # The browser tests against the newest reveal.js. Reported, but does not fail the workflow:
  # a red job here means a reveal.js update needs attention before users upgrade.
  reveal-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Use the latest reveal.js
        run: |
          npm install --no-save reveal.js@latest
          echo "::notice::Testing against reveal.js $(node -p "require('reveal.js/package.json').version")"

      # Tests serve the demos' pinned reveal.js URLs from node_modules; the pinned integrity
      # hashes would reject a different version's files.
      - name: Drop integrity hashes from the demos (CI copy only)
        run: sed -i 's/ integrity="[^"]*"//' demo/*.html create-reveal-rtl/template/index.html

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-reveal-latest
          path: test-results/
          retention-days: 7
