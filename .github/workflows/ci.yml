name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Persian text check
        run: npm run lint:text

      # dist/ and themes/ are committed (the demo and script-tag users load them); they must match the sources.
      - name: Check build output is up to date
        run: |
          npm run build
          git diff --exit-code dist/ themes/ || (echo "::error::dist/ or themes/ is stale. Run 'npm run build' and commit." && exit 1)

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
