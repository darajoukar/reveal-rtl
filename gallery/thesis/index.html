# بررسی تأثیر آموزش مجازی بر یادگیری دانش‌آموزان

**ارائه‌دهنده:** مریم احمدی

**استاد راهنما:** دکتر علی رضایی · **استاد مشاور:** دکتر سارا کریمی

دانشگاه نمونه · دانشکده‌ی علوم تربیتی

<time data-jalali datetime="2025-06-15"></time>

Note: نمونه‌ی ساختگی برای نمایش قالب دفاع پایان‌نامه؛ نام‌ها و اعداد واقعی نیستند.

---

## فهرست مطالب

1. بیان مسئله
2. اهداف و پرسش‌ها
3. پیشینه‌ی پژوهش
4. روش پژوهش
5. یافته‌ها
6. نتیجه‌گیری و پیشنهادها

---

## بیان مسئله

- آموزش مجازی پس از سال 1399 به بخش ثابت مدرسه‌ها تبدیل شد
- اثر آن بر یادگیری دانش‌آموزان دوره‌ی متوسطه روشن نیست
- پژوهش‌های پیشین بیشتر روی دانشجویان انجام شده‌اند

Note: تأکید کنید که شکاف اصلی، نبودِ داده درباره‌ی دانش‌آموزان دوره‌ی متوسطه است.

---

## اهداف و پرسش‌های پژوهش

**هدف اصلی:** سنجش اثر آموزش مجازی بر پیشرفت تحصیلی

- آیا نمره‌ی ریاضی در کلاس مجازی تفاوت معناداری دارد؟
- نقش تعامل معلم و دانش‌آموز چیست؟

---

## روش پژوهش

- نوع پژوهش: نیمه‌آزمایشی با گروه کنترل
- نمونه: 120 دانش‌آموز پایه‌ی دهم در دو گروه
- ابزار: آزمون پیشرفت تحصیلی و پرسش‌نامه‌ی تعامل
- تحلیل: آزمون t مستقل و تحلیل کوواریانس

---

## یافته‌ها

| شاخص | گروه مجازی | گروه حضوری |
|---|---|---|
| میانگین نمره | 15.8 | 16.4 |
| انحراف معیار | 2.1 | 1.9 |
| رضایت دانش‌آموزان | 72 درصد | 81 درصد |

Note: تفاوت نمره‌ها معنادار نبود، اما رضایت در گروه حضوری بیشتر بود.

---

## نتیجه‌گیری و پیشنهادها

- آموزش مجازی افت معناداری در یادگیری ایجاد نکرد
- تعامل معلم مهم‌ترین عامل رضایت بود
- پیشنهاد: کلاس‌های ترکیبی با جلسه‌های پرسش و پاسخ زنده
